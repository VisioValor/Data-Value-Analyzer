<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- VisioValor Favicon - Black Logo on Transparent Background -->
  <g>
    <!-- Abstract symbol - three thick black lines with rounded ends -->
    <!-- Left diagonal line -->
    <line x1="4" y1="6" x2="8" y2="12" stroke="black" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Middle inverted V shape -->
    <path d="M 12 6 L 16 10 L 12 14" stroke="black" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Right diagonal line -->
